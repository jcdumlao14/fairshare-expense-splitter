openapi: 3.0.3

info:
  title: FairShare API
  description: REST API for the FairShare expense splitter.
  version: 0.1.0

servers:
  - url: http://localhost:8000

tags:
  - name: Health
  - name: Groups
  - name: Members
  - name: Expenses
  - name: Balances

paths:

  /api/health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is healthy

  /api/groups:
    get:
      tags:
        - Groups
      summary: List expense groups
      responses:
        "200":
          description: List of groups

    post:
      tags:
        - Groups
      summary: Create an expense group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Group created

  /api/groups/{group_id}:
    get:
      tags:
        - Groups
      summary: Get an expense group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group found
        "404":
          description: Group not found

  /api/groups/{group_id}/members:
    get:
      tags:
        - Members
      summary: List group members
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: List of members

    post:
      tags:
        - Members
      summary: Add a group member
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        "201":
          description: Member created

  /api/groups/{group_id}/expenses:
    get:
      tags:
        - Expenses
      summary: List group expenses
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: List of expenses

    post:
      tags:
        - Expenses
      summary: Create an expense
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense created

  /api/groups/{group_id}/balances:
    get:
      tags:
        - Balances
      summary: Calculate group balances
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Calculated balances

components:

  parameters:

    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:

    GroupCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Group:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MemberCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Member:
      type: object
      required:
        - id
        - group_id
        - name
      properties:
        id:
          type: integer
        group_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time

    ExpenseCreate:
      type: object
      required:
        - description
        - amount
        - payer_id
        - participant_ids
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        payer_id:
          type: integer
          minimum: 1
        participant_ids:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1

    Expense:
      type: object
      required:
        - id
        - group_id
        - description
        - amount
        - payer_id
        - participant_ids
      properties:
        id:
          type: integer
        group_id:
          type: integer
        description:
          type: string
        amount:
          type: number
        payer_id:
          type: integer
        participant_ids:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      required:
        - member_id
        - member_name
        - balance
      properties:
        member_id:
          type: integer
        member_name:
          type: string
        balance:
          type: number
          description: Positive means the member should receive money; negative means the member owes money.
          