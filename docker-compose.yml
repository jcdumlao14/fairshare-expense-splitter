services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fairshare-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/fairshare.db
    volumes:
      - fairshare-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: fairshare-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fairshare-data: